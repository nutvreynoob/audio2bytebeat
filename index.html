<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>audio2bytebeat CMD</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #cccccc;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 20px;
        }
        .terminal {
            max-width: 850px;
            margin: 0 auto;
        }
        .output {
            white-space: pre-wrap;
            margin-top: 15px;
            color: #00ff00;
            background: #050505;
            padding: 15px;
            border: 1px solid #222;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
        }
        .input-section {
            margin: 15px 0;
            background: #111;
            padding: 15px;
            border: 1px solid #333;
        }
        input, select {
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #555;
            padding: 6px;
            font-family: monospace;
            margin: 5px 0;
        }
        /* Style for the Run Button */
        #run-btn {
            background: #00ff00;
            color: #000;
            cursor: pointer;
            border: 1px solid #00ff00;
            font-weight: bold;
            padding: 8px 20px;
            font-family: 'Consolas', monospace;
            margin-top: 15px;
            display: inline-block;
        }
        #run-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
        label { display: inline-block; width: 220px; color: #aaa; }
    </style>
</head>
<body>

<div class="terminal">
    <p>Microsoft Windows [Version 10.0.19045]<br>(c) Microsoft Corporation. All rights reserved.</p>
    <p>C:\Users\GitHub\audio2bytebeat> <span style="color: #fff;">python audio2bOG.py</span></p>
    
    <div class="input-section">
        <label>Select MP3 File:</label>
        <input type="file" id="audio-file" accept=".mp3"><br>
        
        <label>Make audio loop? (y/n):</label>
        <select id="loop-opt">
            <option value="y">y</option>
            <option value="n">n</option>
        </select><br>
        
        <label>Sample rate? (Hz):</label>
        <input type="number" id="sr-opt" value="8000"><br>
        
        <label>Format type? (f/m/s):</label>
        <select id="format-opt">
            <option value="m">mixed - E, \x00</option>
            <option value="f">formatted - \x69, \x00</option>
            <option value="s">special - E, NUL</option>
        </select><br>
        
        <button id="run-btn">EXECUTE CONVERSION</button>
    </div>
    
    <hr style="border-color: #333; margin: 20px 0;">
    
    <p><strong>Terminal Output:</strong></p>
    <div id="terminal-output" class="output">Awaiting configuration and file input...</div>
</div>

<script>
function getCharacterHex(a) {
    let hex = (a & 0xffff).toString(16);
    while (hex.length < 2) { hex = "0" + hex; }
    return hex.length === 2 ? "\\x" + hex : "\\u" + hex;
}

function generateChsTable(format) {
    let table = [];
    for (let a = 0; a < 256; a++) {
        if (format === 'f') {
            table.push(getCharacterHex(a));
        } else if (format === 's') {
            if (a === 92) table.push("\\\\");
            else if (a === 96) table.push("\\`");
            else if (a === 10) table.push("\\n");
            else if (a === 13) table.push("\\r");
            else table.push(String.fromCharCode(a));
        } else { 
            if ((a > 0x1f && a < 0x7f) || (a > 0xa0)) {
                if (a === 92) table.push("\\\\");
                else if (a === 96) table.push("\\`");
                else table.push(String.fromCharCode(a));
            } else {
                table.push(getCharacterHex(a));
            }
        }
    }
    return table;
}

function toAdd(a, rep, chs) {
    let charStr = chs[a];
    let safeChar = charStr;
    if (charStr === "\n") safeChar = "\\n";
    if (charStr === "\x0d") safeChar = "\\r";
    
    let repStr = `\${r(\`${safeChar}\`,${rep})}`;
    if (rep === 1 || repStr.length > charStr.length * rep) {
        return charStr.repeat(rep);
    } else {
        return repStr;
    }
}

// Core processing engine matching your audio2bOG.py logic
async function startProcessing() {
    const fileInput = document.getElementById('audio-file');
    const outputDiv = document.getElementById('terminal-output');
    
    if (fileInput.files.length === 0) {
        outputDiv.innerHTML = "ERROR: Please select an MP3 file first.";
        return;
    }
    
    const file = fileInput.files[0];
    const loop = document.getElementById('loop-opt').value === 'y';
    const samplerate = parseInt(document.getElementById('sr-opt').value);
    const format = document.getElementById('format-opt').value;
    
    outputDiv.innerHTML = "Reading file streams...\n";
    
    try {
        const arrayBuffer = await file.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        outputDiv.innerHTML += "Decoding MP3 natively via Browser AudioContext...\n";
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        
        outputDiv.innerHTML += `Resampling audio to mono channel at ${samplerate}Hz (Bypassing FFmpeg)...\n`;
        const offlineCtx = new OfflineAudioContext(1, audioBuffer.duration * samplerate, samplerate);
        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(offlineCtx.destination);
        source.start();
        
        const renderedBuffer = await offlineCtx.startRendering();
        const vals = renderedBuffer.getChannelData(0); 
        
        outputDiv.innerHTML += `Processing ${vals.length} samples. Running script compression algorithms...\n`;
        
        const chs = generateChsTable(format);
        let finalStr = "";
        let rep = 0;
        let bef = Math.floor(((vals[0] + 1) / 2) * 255);
        if (bef < 0) bef = 0; if (bef > 255) bef = 255;
        
        for (let vi = 0; vi < vals.length; vi++) {
            rep += 1;
            let val = vals[vi];
            let v = Math.floor(((val + 1) / 2) * 255);
            if (v < 0) v = 0; if (v > 255) v = 255;
            
            if (bef !== v) {
                finalStr += toAdd(v, rep, chs);
                bef = v;
                rep = 0;
            }
            
            if (vi % 100000 === 0 || vi === vals.length - 1) {
                let progress = ((vi / vals.length) * 100).toFixed(1);
                outputDiv.innerHTML = `Encoding stream details...\nProcessing wave data: ${progress}% completed...`;
            }
        }
        
        let finalFormula = "";
        if (loop) {
            finalFormula = `z=0,r=(b,c)=>b.repeat(c),a=\`${finalStr}\`;return ((t,sr)=>{z+=((a.charCodeAt((t*${samplerate})%a.length)/(255/2)-1)-z)/Math.max(sr/${samplerate},1);if(!z){z=0};return z})`;
        } else {
            finalFormula = `z=0,r=(b,c)=>b.repeat(c),a=\`${finalStr}\`;return ((t,sr)=>{z+=(((t*${samplerate}<a.length?a.charCodeAt(t*${samplerate})/(255/2)-1:0))-z)/Math.max(sr/${samplerate},1);if(!z){z=0};return z})`;
        }
        
        outputDiv.innerHTML = `Output written successfully!\n\nC:\\audio2bytebeat\\output.txt>\n\n${finalFormula}`;
        
    } catch (err) {
        outputDiv.innerHTML = `CRITICAL ERROR: ${err.message}\nMake sure it is a valid audio file.`;
    }
}

// Click listener for the new button
document.getElementById('run-btn').addEventListener('click', startProcessing);

// Fallback listener: Automatically runs immediately if they pick a file!
document.getElementById('audio-file').addEventListener('change', startProcessing);
</script>

</body>
</html>
