<script>
// Helper to get hex string matching your Python logic
function getCharacterHex(a) {
    let hex = (a & 0xffff).toString(16);
    while (hex.length !== 2 && hex.length !== 4) { hex = "0" + hex; }
    return hex.length === 2 ? "\\x" + hex : "\\u" + hex;
}

// Generates the characters lookup array exactly like your Python script
function generateChsTable(format) {
    let table = [];
    for (let a = 0; a < 256; a++) {
        if (format === 'f') {
            table.push(getCharacterHex(a));
        } else if (format === 's') {
            let c = String.fromCharCode(a);
            if (a === 92) table.push("\\\\");
            else if (a === 96) table.push("\\`");
            else if (a === 10) table.push("\\n");
            else if (a === 13) table.push("\\r");
            else table.push(c);
        } else { // 'm' - Mixed format
            if ((a > 0x1f && a < 0x7f) || (a > 0xa0)) {
                let c = String.fromCharCode(a);
                if (a === 92) table.push("\\\\");
                else if (a === 96) table.push("\\`");
                else table.push(c);
            } else {
                table.push(getCharacterHex(a));
            }
        }
    }
    return table;
}

function toAdd(a, rep, chs) {
    let charStr = chs[a];
    let safeChar = charStr;
    if (charStr === "\n") safeChar = "\\n";
    if (charStr === "\x0d") safeChar = "\\r";
    
    let repStr = `\${r(\`${safeChar}\`,${rep})}`;
    if (rep === 1 || repStr.length > charStr.length * rep) {
        return charStr.repeat(rep);
    } else {
        return repStr;
    }
}

        if (bef < 0) bef = 0; if (bef > 255) bef = 255;
        
        for (let vi = 0; vi < vals.length; vi++) {

            let val = vals[vi];
            let v = Math.floor(((val + 1) / 2) * 255);
            if (v < 0) v = 0; if (v > 255) v = 255;
            
            if (bef !== v) {
                finalStr += toAdd(v, rep, chs);
                bef = v;
                rep = 0;
            }
            
            // Periodically print progress status text
            if (vi % 50000 === 0 || vi === vals.length - 1) {
                let progress = ((vi / vals.length) * 100).toFixed(2);
                outputDiv.innerHTML = `Decoding MP3 natively via Browser AudioContext...\nResampling audio to mono channel at ${samplerate}Hz (Replacing FFmpeg)...\nProcessing samples: ${progress}% completed...`;
            }
        }
        
        // Final wrapping structure based on loop option
